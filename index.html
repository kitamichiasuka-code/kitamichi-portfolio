<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="北道あすかのWeb・クリエイティブポートフォリオです。"
    />
    <title>KITAMICHI DESIGN | Web & Creative Portfolio</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="header">
      <a href="#" class="logo">
        <span class="logo__name">KITAMICHI DESIGN</span>
        <span class="logo__sub">Web & Creative Portfolio</span>
      </a>

      <nav class="nav">
        <a href="#about">ABOUT</a>
        <a href="#works">WORKS</a>

    <main>

        <div class="hero__content">
          <div class="hero__inner">
            <h1>想いを、<br />伝わるカタチに。</h1>
            <p class="hero-lead">

            <p class="hero__signature">Design for<br />a Brighter Tomorrow</p>
            <p class="hero__location">NISHITAMA, TOKYO 2026</p>

          <div class="hero-image">
            <img
              src="images/hero.jpg"
              alt="Webサイトを表示したノートパソコン"
            />
          </div>
        </div>
      </section>

      <section id="works" class="works">
        <h2>WORKS</h2>
      </section>

      <section id="skills"></section>
      <section id="about"></section>
      <section id="service"></section>
